name: Apply XLSX UI integration

on:
  push:
    branches: [agent/xlsx-v0.2]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/xlsx-v0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply integration patch
        run: node scripts/apply-xlsx-ui.mjs
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git rm scripts/apply-xlsx-ui.mjs .github/workflows/xlsx-apply.yml
          git commit -m "Integrate local XLSX workflow"
          git push origin HEAD:agent/xlsx-v0.2
