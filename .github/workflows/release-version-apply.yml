name: Prepare v0.2.0 package metadata

on:
  push:
    branches: [agent/release-v0.2.0]

permissions:
  contents: write

jobs:
  version:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-v0.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Update package metadata
        run: npm version 0.2.0 --no-git-tag-version
      - name: Commit metadata and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/release-version-apply.yml
          git commit -m "Prepare package metadata for v0.2.0"
          git push origin HEAD:agent/release-v0.2.0
