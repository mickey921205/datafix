name: Apply duplicate detection UI

on:
  push:
    branches: [agent/duplicate-detection-v1]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/duplicate-detection-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply duplicate detection integration
        run: node scripts/apply-duplicate-ui.mjs
      - name: Commit integration and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git rm scripts/apply-duplicate-ui.mjs .github/workflows/duplicate-ui-apply.yml
          git commit -m "Integrate exact duplicate detection"
          git push origin HEAD:agent/duplicate-detection-v1
